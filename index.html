<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Clock">
<title>Living Room Clock</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; min-height: 100%; overflow: hidden;
  background: #070b12; color: #f4f7fb;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
body {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
}
.screen {
  position: relative; width: 100vw; height: 100vh; min-height: 320px;
  padding: 5vh 6vw; overflow: hidden;
  background: radial-gradient(ellipse at 80% 45%, rgba(20,48,80,.30), transparent 48%),
    linear-gradient(125deg, #080c13 0%, #0b111b 58%, #090e16 100%);
}
.header {
  position: relative; z-index: 1; height: 12%;
  display: -webkit-flex; display: flex; align-items: center;
  font-size: 2.15vw; font-weight: 700;
  letter-spacing: .19em; color: #e7edf6;
}
.home-icon { font-size: 1.2em; margin-right: 14px; color: #68a9ec; }
.content {
  position: relative; z-index: 1; height: 74%;
  display: -webkit-flex; display: flex; align-items: center;
}
.main {
  width: 68%; padding-right: 4vw;
}
.time {
  white-space: nowrap; font-weight: 750;
  font-size: 13.2vw; line-height: 1;
  letter-spacing: -0.045em; font-variant-numeric: tabular-nums;
  color: #f6f8fc; text-shadow: 0 3px 24px rgba(0,0,0,.25);
}
.date {
  margin-top: 3.5vh; padding-top: 2.4vh;
  border-top: 2px solid rgba(82,153,222,.72);
  font-size: 2.25vw; line-height: 1.35;
  font-weight: 700; letter-spacing: .07em; white-space: nowrap;
  color: #cbd6e5;
}
.weather {
  width: 32%; height: 68%; min-width: 190px;
  border: 1px solid rgba(130,161,195,.18); border-radius: 18px;
  background: rgba(17,27,41,.76); box-shadow: 0 14px 36px rgba(0,0,0,.2);
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  text-align: center; padding: 2vh 1.5vw;
}
.weather-icon { font-size: 5.5vw; line-height: 1.15; }
.temp { font-size: 4.4vw; font-weight: 800; margin-top: 8px; }
.condition { color: #d0dbea; font-size: 1.9vw; margin-top: 8px; }
.city { color: #91a6bf; font-size: 1.25vw; margin-top: 18px; letter-spacing: .12em; }
.footer {
  position: relative; z-index: 1; height: 14%;
  display: -webkit-flex; display: flex; align-items: flex-end;
  justify-content: space-between; color: #8193a8;
  font-size: 1.15vw; letter-spacing: .16em;
}
@media (orientation: portrait) {
  .screen { padding: 3vh 7vw; }
  .header { height: 12%; font-size: 4vw; }
  .content { height: 76%; -webkit-flex-direction: column; flex-direction: column; justify-content: center; }
  .main { width: 100%; padding: 0; text-align: center; }
  .time { font-size: 16vw; }
  .date { margin-top: 3vh; font-size: 3.6vw; white-space: normal; }
  .weather { width: 84%; height: auto; min-width: 0; margin-top: 4vh; padding: 2.4vh 4vw; }
  .weather-icon { font-size: 10vw; }
  .temp { font-size: 8vw; }
  .condition { font-size: 4vw; }
  .city { margin-top: 5px; }
  .city, .footer { font-size: 2.6vw; }
  .footer { height: 12%; }
}
</style>
</head>
<body>
<div class="screen">
  <div class="header"><span class="home-icon">⌂</span><span>PHÒNG KHÁCH</span></div>
  <div class="content">
    <div class="main">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date">THỨ HAI, 16 THÁNG 11, 2026</div>
    </div>
    <div class="weather">
      <div class="weather-icon" id="weatherIcon">☁</div>
      <div class="temp" id="temp">--°C</div>
      <div class="condition" id="condition">Đang tải thời tiết</div>
      <div class="city" id="city">TP. HỒ CHÍ MINH</div>
    </div>
  </div>
  <div class="footer"><span>LOCAL TIME</span><span id="updated">WEATHER · --:--</span></div>
</div>
<script>
/* Có thể đổi tọa độ và tên thành phố tại đây.
   Mặc định: TP. Hồ Chí Minh */
var LAT = 10.8231;
var LON = 106.6297;
var CITY = "TP. HỒ CHÍ MINH";

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function updateClock() {
  var now = new Date();
  var days = ["CHỦ NHẬT","THỨ HAI","THỨ BA","THỨ TƯ","THỨ NĂM","THỨ SÁU","THỨ BẢY"];
  document.getElementById("time").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.getElementById("date").textContent =
    days[now.getDay()] + ", " + pad(now.getDate()) +
    " THÁNG " + (now.getMonth()+1) + ", " + now.getFullYear();
}
function weatherText(code) {
  if (code === 0) return ["☀","Trời quang"];
  if (code === 1 || code === 2) return ["🌤","Ít mây"];
  if (code === 3) return ["☁","Nhiều mây"];
  if (code === 45 || code === 48) return ["🌫","Sương mù"];
  if (code >= 51 && code <= 67) return ["🌧","Mưa nhỏ"];
  if (code >= 71 && code <= 77) return ["❄","Có tuyết"];
  if (code >= 80 && code <= 82) return ["🌦","Mưa rào"];
  if (code >= 95) return ["⛈","Dông"];
  return ["☁","Nhiều mây"];
}
function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" +
    LAT + "&longitude=" + LON + "&current=temperature_2m,weather_code&timezone=Asia%2FBangkok";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 12000;
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status >= 200 && xhr.status < 300) {
      try {
        var data = JSON.parse(xhr.responseText);
        var current = data.current;
        var desc = weatherText(current.weather_code);
        document.getElementById("weatherIcon").textContent = desc[0];
        document.getElementById("temp").textContent = Math.round(current.temperature_2m) + "°C";
        document.getElementById("condition").textContent = desc[1];
        document.getElementById("city").textContent = CITY;
        var now = new Date();
        document.getElementById("updated").textContent = "CẬP NHẬT " + pad(now.getHours()) + ":" + pad(now.getMinutes());
      } catch(e) {
        document.getElementById("condition").textContent = "Không đọc được dữ liệu";
      }
    } else if (xhr.readyState === 4) {
      document.getElementById("condition").textContent = "Kiểm tra kết nối mạng";
    }
  };
  xhr.ontimeout = function() {
    document.getElementById("condition").textContent = "Thời tiết tạm gián đoạn";
  };
  xhr.send();
}
updateClock();
setInterval(updateClock, 1000);
loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);
</script>
</body>
</html>
